name: Pediatrix Medical Group (formerly MEDNAX)
aid: mednax
description: >-
  Pediatrix Medical Group, Inc. (NYSE: MD) — known as MEDNAX until its 2022 rebrand, and still
  reachable at mednax.com, which now redirects to www.pediatrix.com — is a US physician services
  organization delivering neonatal, maternal-fetal, pediatric cardiology, pediatric surgery and
  other pediatric subspecialty care through affiliated practices at hospitals and clinics across
  the country. Its one software product, BabySteps Cloud, is a cloud clinical documentation tool
  for NICUs that feeds the Pediatrix Clinical Data Warehouse and is sold to hospital partners as
  an end-user product. As of a 2026-09-04 probe pass Pediatrix publishes no public API, developer
  portal, machine-readable specification, or /.well-known/ discovery document. The MEDNAX
  Radiology Solutions / vRad business covered by this repository's older press and blog archive
  was sold to Radiology Partners in December 2020 and is no longer part of this company.
